runtime:
  name: node@24
  health_path: /
  readiness_timeout_seconds: 120
preset: nextjs
type: app
scaffold_cmd: cp -rn /app/. /workspace/
dependency_cmd: pnpm install --frozen-lockfile
build_cmd: |
  set -e
  pnpm run build
  mkdir -p .next/standalone/.next
  cp -R public .next/standalone/public
  cp -R .next/static .next/standalone/.next/static
start_cmd: HOSTNAME=0.0.0.0 PORT=${PORT:-8080} node .next/standalone/server.js
env:
  NODE_ENV: production
  PORT: "8080"
  HOSTNAME: 0.0.0.0
