name: Validate template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check repository contract
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s adios.yaml
          test -s .gitignore
          test -s .editorconfig
          grep -q "adios up" README.md
          ruby -e 'require "yaml"; content = File.read("adios.yaml"); value = begin; YAML.safe_load(content, permitted_classes: [], permitted_symbols: [], aliases: true); rescue ArgumentError; YAML.safe_load(content, [], [], true); end; abort "adios.yaml must contain a mapping" unless value.is_a?(Hash)'
          if git ls-files \
            | grep -E '(^|/)(node_modules|\.next|dist|build|bin|obj|out|vendor|\.venv|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache|coverage|staticfiles)(/|$)|\.py[co]$' \
            | grep -Ev '^bin/rails$' \
            | grep -q .; then
            echo "Generated dependencies or build output are tracked" >&2
            exit 1
          fi
